<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Detection</title>
</head>
<body>
  <!-- Hidden static HTML form for Netlify Form Engine discovery -->
  <form name="contact_submissions" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact_submissions" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="service" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
